# CI — PR·main push 마다 GitHub 서버에서 자동 검사 (키·스냅샷 없음 → mock 테스트, 실데이터 테스트는 자동 skip)
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:            # 같은 PR 에 새 push 가 오면 이전 실행은 취소(시간 절약)
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python 3.14, lock)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: 의존성 설치 (해시 검사)
        run: python -m pip install --require-hashes -r requirements.lock
      - name: 테스트 (mock + 스냅샷 있으면 실데이터)
        run: python tasks.py test

  docker:
    name: docker (빌드 + 컨테이너 안 테스트, 네트워크 차단)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 이미지 빌드
        run: docker build -t jeju-coach:ci --build-arg GIT_COMMIT=${GITHUB_SHA::7} .
      - name: 컨테이너 안 테스트 (--network none)
        run: docker run --rm --network none jeju-coach:ci python tasks.py test

# ★C 행동 카탈로그 (15개, 결정 기록: docs/decisions_C.md 2026-11-17 ①)
# - 비용(cost_krw)은 카페 운영 상식선의 **추정치**이며 점주가 조정한다(출처 있는 실측값 아님).
# - fits: 맞는 진단 유형(co_decline 동네 동반 하락 / only_me 나만 하락 / season_weather 계절·날씨)
# - requires: 점주가 '바꿀 수 있다'고 고른 항목(menu·hours·price·channel) 중 이 실험에 필요한 것
# - extra_staff: 새로 필요한 인원(점주 입력에 '채용 가능' 칸이 없어 0 인 항목만 추천)
# - min_staff_am / min_staff_pm: 그 시간대에 이미 있어야 하는 최소 인원(B 가 받는 staff_am/pm 과 비교)
# - measure_ease: 지표·중단 기준을 판단하는 데 필요한 기록 (decisions_C ②)
#     3 = POS(주문·매출·메뉴별 판매)만으로 판단 / 2 = POS + 점주의 간단한 별도 기록(폐기·할인액·강수일 구분 등)
#     1 = 지도앱·배달앱 통계 화면이나 손님 표본 기록이 필요
# - X06·X15 는 예산 30만 원을 넘는 항목(예산이 큰 점주용 + 예산 필터 시험용)
# 문구 규칙: CLAUDE.md §5 금지 해석(반경·매장 방문객·관광객·원인 단정 등)을 쓰지 않는다.

- id: X01
  title: 평일 오후 테이크아웃 묶음(기존 메뉴 2종) 한정 판매
  fits: [co_decline, season_weather]
  requires: [menu, price]
  cost_krw: 50000
  extra_staff: 0
  min_staff_am: 1
  min_staff_pm: 1
  measure_ease: 2
  metric: 평일 14~17시 주문 수와 공헌이익(매출 − 재료비 − 할인액)
  stop_rule: 첫 주 할인·폐기 비용이 늘어난 공헌이익보다 크면 2주차는 중단

- id: X02
  title: 비 오는 날 한정 배달앱 쿠폰
  fits: [season_weather]
  requires: [channel]
  cost_krw: 100000
  extra_staff: 0
  min_staff_am: 1
  min_staff_pm: 1
  measure_ease: 2
  metric: 강수일 배달 주문 수(같은 기간 비강수일과 비교)
  stop_rule: 쿠폰 비용이 강수일에 늘어난 공헌이익보다 크면 중단

- id: X03
  title: 대표 메뉴 1종 가격·구성 점검(같은 동네 카페 메뉴판 3곳 비교 후 조정)
  fits: [only_me]
  requires: [menu, price]
  cost_krw: 0
  extra_staff: 0
  min_staff_am: 1
  min_staff_pm: 1
  measure_ease: 3
  metric: 대표 메뉴 판매 비중과 객단가
  stop_rule: 대표 메뉴 판매량이 변경 전 2주보다 10% 이상 줄면 원래대로 되돌림

- id: X04
  title: 지도앱·SNS 매장 정보(사진·영업시간·메뉴) 정비와 리뷰 답글
  fits: [only_me, co_decline]
  requires: [channel]
  cost_krw: 0
  extra_staff: 0
  min_staff_am: 1
  min_staff_pm: 1
  measure_ease: 1
  metric: 지도앱 길찾기·전화 클릭 수, 영수증 표본으로 본 처음 온 손님 비율
  stop_rule: 비용이 들지 않아 중단 대신, 2주 뒤 클릭 수가 직전 2주보다 늘지 않으면 다른 실험으로 바꿈

